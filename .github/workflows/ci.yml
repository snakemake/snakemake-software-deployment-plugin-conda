name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  TEST_ENV_DIR: /tmp/test-env

jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0

      - name: Check formatting
        run: pixi run format --check .

  linting:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0

      - name: Check code
        run: pixi run lint

  testing:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    # only run if commit message does not start with "chore(main): release"
    if: >-
      !startsWith(github.event.head_commit.message, 'chore(main): release')
    steps:
      - uses: actions/checkout@v4

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0
        with:
          environments: dev

      - uses: conda-incubator/setup-miniconda@v3
        with:
          channels: conda-forge,nodefaults

      - name: Setup Apptainer
        if: runner.os == 'Linux'
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.5.3

      - name: Build source and wheel distribution + check build
        run: pixi run check-build

      - name: Publish current package to TestPyPI
        if: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Deploy external test env
        shell: bash -el {0}
        run: |
          conda create -n test-env stress-ng
          conda create -p $TEST_ENV_DIR stress-ng

      - name: Run pytest
        env:
          PIP_INDEX_URL: https://pypi.org/simple/
          PIP_EXTRA_INDEX_URL: https://test.pypi.org/simple/
          TEST_NAMED_ENV: "1"
          TEST_DIRECTORY_ENV: "1"
        run: pixi run test -v

      - name: Run Coverage
        run: pixi run coverage-report
